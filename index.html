<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="theme-color" content="#F5F0E1">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Workout Tracker</title>
<style>
  :root{
    --bg:#F5F0E1;
    --dark:#3A3A3A;
    --green:#6B9E5E;
    --green-dark:#4F7A45;
    --red:#D9645A;
    --red-dark:#B94D45;
    --yellow:#E4C158;
    --yellow-dark:#C7A53E;
    --blue:#5B8FB9;
    --blue-dark:#48719A;
    --text-on-dark:#F5F0E1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#2b2b2b;}
  body{padding-bottom:env(safe-area-inset-bottom); padding-top:env(safe-area-inset-top);}
  .screen{display:none; max-width:520px; margin:0 auto; padding:20px 18px 40px;}
  .screen.active{display:block;}
  h1.title{text-align:center; font-size:28px; font-weight:600; margin:8px 0 22px;}
  .row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--dark); color:var(--text-on-dark);
    border-radius:20px; padding:20px 22px; margin-bottom:14px;
    cursor:pointer; user-select:none; border:none; width:100%; text-align:left;
    font-size:20px; font-weight:600;
  }
  .row.green{background:var(--green);}
  .row.red{background:var(--red);}
  .row.yellow{background:var(--yellow); color:#2b2b2b;}
  .row.blue{background:var(--blue);}
  .row-left{display:flex; align-items:center; gap:14px;}
  .row-icon{
    width:30px; height:30px; border-radius:50%; border:2px solid currentColor;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px;
  }
  .chevron{opacity:0.85; font-size:20px;}
  .btn{
    display:block; width:100%; text-align:center; padding:18px; border-radius:30px;
    border:none; font-size:18px; font-weight:600; margin-bottom:14px; cursor:pointer;
  }
  .btn-primary{background:var(--green); color:white;}
  .btn-dark{background:var(--dark); color:var(--text-on-dark);}
  .btn-danger{background:var(--red); color:white;}
  .btn-outline{background:transparent; border:2px dashed #999; color:#555;}
  .exercise-card{background:var(--dark); color:var(--text-on-dark); border-radius:18px; padding:16px 18px; margin-bottom:12px;}
  .exercise-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;}
  .exercise-name{font-size:19px; font-weight:600; cursor:pointer;}
  .exercise-meta{font-size:14px; opacity:0.85; text-align:right;}
  .sets-row{display:flex; gap:8px; flex-wrap:wrap;}
  .set-box{
    width:38px; height:38px; border-radius:10px; border:2px solid #8fd18a;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .set-box.checked{background:#8fd18a; color:#1c3a17; font-weight:700;}
  .set-box svg{width:20px; height:20px;}
  .del-x{background:none; border:none; color:#e8a; font-size:13px; opacity:0.7; cursor:pointer; padding:2px 4px;}
  label.field-label{display:block; font-size:16px; margin:16px 0 8px; font-weight:500;}
  input.field-input{
    width:100%; padding:14px 16px; border-radius:16px; border:none; background:var(--dark);
    color:white; font-size:17px;
  }
  input.field-input::placeholder{color:#aaa;}
  .stepper{display:flex; align-items:center; background:var(--dark); border-radius:16px; overflow:hidden;}
  .stepper button{background:#555; color:white; border:none; width:50px; height:52px; font-size:22px; cursor:pointer;}
  .stepper input{flex:1; text-align:center; background:transparent; border:none; color:white; font-size:20px; font-weight:700; -moz-appearance:textfield;}
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; background:var(--dark); color:white; border-radius:16px; padding:14px 18px; margin-bottom:16px;}
  .switch{position:relative; width:50px; height:28px;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; cursor:pointer; inset:0; background:#666; border-radius:28px; transition:0.2s;}
  .slider:before{position:absolute; content:""; height:22px; width:22px; left:3px; top:3px; background:white; border-radius:50%; transition:0.2s;}
  input:checked + .slider{background:var(--blue);}
  input:checked + .slider:before{transform:translateX(22px);}
  .hist-row{background:var(--dark); color:var(--text-on-dark); border-radius:18px; margin-bottom:12px; overflow:hidden;}
  .hist-row.green{background:var(--green);}
  .hist-row.red{background:var(--red);}
  .hist-row.yellow{background:var(--yellow); color:#2b2b2b;}
  .hist-row.blue{background:var(--blue);}
  .hist-head{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; cursor:pointer; font-size:19px; font-weight:600;}
  .hist-body{padding:0 22px 16px; font-size:15px; display:none;}
  .hist-body.open{display:block;}
  .hist-ex-line{display:flex; justify-content:space-between; padding:4px 0;}
  .empty-note{text-align:center; color:#888; margin:30px 0; font-size:15px;}
  .back-link{background:none;border:none;color:#555;font-size:16px;margin-bottom:14px;cursor:pointer;padding:6px 0;}
</style>
</head>
<body>

<div id="app">

  <div class="screen active" id="screen-home">
    <h1 class="title">This Week</h1>
    <div id="home-rows"></div>
    <button class="btn btn-dark" onclick="goHistory()">View Log History</button>
  </div>

  <div class="screen" id="screen-day">
    <h1 class="title" id="day-title">Day</h1>
    <div class="toggle-row">
      <span>Rest day</span>
      <label class="switch">
        <input type="checkbox" id="rest-toggle" onchange="toggleRest()">
        <span class="slider"></span>
      </label>
    </div>
    <div id="exercise-list"></div>
    <div id="add-exercise-prompt" class="btn btn-outline" onclick="goAdd()">
      <div style="font-size:26px;">+</div>
      <div>Add specific exercises</div>
    </div>
    <div style="height:18px;"></div>
    <button class="btn btn-primary" onclick="saveProgress()">Save All Progress</button>
    <button class="btn btn-dark" onclick="goHome()">Back to main screen</button>
  </div>

  <div class="screen" id="screen-add">
    <h1 class="title" id="add-title">Add New Exercise</h1>
    <label class="field-label">Workout Name:</label>
    <input class="field-input" id="add-name" placeholder="e.g. Push ups">

    <label class="field-label">Sets</label>
    <div class="stepper">
      <button onclick="step('add-sets',-1,1)">-</button>
      <input class="field-input" id="add-sets" type="number" value="3" min="1">
      <button onclick="step('add-sets',1,1)">+</button>
    </div>

    <label class="field-label">Reps</label>
    <div class="stepper">
      <button onclick="step('add-reps',-1,0)">-</button>
      <input class="field-input" id="add-reps" type="number" value="10" min="0">
      <button onclick="step('add-reps',1,0)">+</button>
    </div>

    <label class="field-label">Time in seconds (optional)</label>
    <div class="stepper">
      <button onclick="step('add-time',-5,0)">-</button>
      <input class="field-input" id="add-time" type="number" value="0" min="0">
      <button onclick="step('add-time',5,0)">+</button>
    </div>

    <div style="height:10px;"></div>
    <button class="btn btn-primary" onclick="submitExercise()">Add exercise</button>
    <button class="btn btn-danger" id="add-delete-btn" style="display:none;" onclick="deleteExercise()">Delete exercise</button>
    <button class="btn btn-dark" onclick="cancelAdd()">Cancel</button>
  </div>

  <div class="screen" id="screen-history">
    <h1 class="title">Log History</h1>
    <div id="history-rows"></div>
    <div id="history-empty" class="empty-note" style="display:none;">No workouts logged yet.</div>
    <button class="btn btn-dark" onclick="goHome()">Back to main screen</button>
  </div>

</div>

<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const HISTORY_DAYS_KEEP = 35;

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

function getPlan(){ return loadJSON('wt_plan', {}); }
function savePlan(p){ saveJSON('wt_plan', p); }
function getRest(){ return loadJSON('wt_rest', {}); }
function saveRest(r){ saveJSON('wt_rest', r); }

function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function displayDate(d){
  return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
}
function getLog(key){ return loadJSON('wt_log_'+key, null); }
function saveLog(key, data){ saveJSON('wt_log_'+key, data); }
function deleteLogKey(key){ localStorage.removeItem('wt_log_'+key); }

function pruneOldLogs(){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - HISTORY_DAYS_KEEP);
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('wt_log_')===0){
      const ds = k.replace('wt_log_','');
      const d = new Date(ds+'T00:00:00');
      if(!isNaN(d) && d < cutoff){ localStorage.removeItem(k); i--; }
    }
  }
}

function startOfWeek(d){
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  const monday = new Date(d);
  monday.setDate(d.getDate()+diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function getWeekDates(){
  const today = new Date(); today.setHours(0,0,0,0);
  const monday = startOfWeek(today);
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    out.push(d);
  }
  return out;
}

function newId(){ return 'ex_'+Date.now()+'_'+Math.floor(Math.random()*10000); }

function computeStatus(exercises){
  let total=0, done=0;
  exercises.forEach(ex=>{
    total += ex.sets;
    done += ex.completed.filter(Boolean).length;
  });
  if(total===0) return 'empty';
  if(done===0) return 'red';
  if(done>=total) return 'green';
  return 'yellow';
}

let currentDayIdx = null;
let currentDate = null;
let editingExerciseId = null;

function renderHome(){
  pruneOldLogs();
  const plan = getPlan();
  const rest = getRest();
  const weekDates = getWeekDates();
  const today = new Date(); today.setHours(0,0,0,0);
  const container = document.getElementById('home-rows');
  container.innerHTML = '';

  weekDates.forEach((d, idx)=>{
    const dayName = DAYS[idx];
    const key = dateKey(d);
    const log = getLog(key);
    const dayExercises = (plan[dayName]||[]);
    const isPast = d.getTime() < today.getTime();
    // Past days: only actually-logged rest counts. Today/future: recurring setting previews as rest.
    const isRest = isPast ? !!(log && log.isRest) : !!rest[dayName];

    let cls = 'dark';
    let icon = '';

    if(isRest){
      cls = 'blue'; icon = '&#8226;';
    } else if(d.getTime() === today.getTime()){
      cls = 'dark'; icon = '&rarr;';
    } else if(d.getTime() > today.getTime()){
      cls = 'dark'; icon = '';
    } else {
      if(dayExercises.length===0){
        cls='dark'; icon='';
      } else if(!log){
        cls='red'; icon='&#10005;';
      } else {
        const st = computeStatus(log.exercises);
        if(st==='green'){ cls='green'; icon='&#10003;'; }
        else if(st==='yellow'){ cls='yellow'; icon='!'; }
        else { cls='red'; icon='&#10005;'; }
      }
    }

    const btn = document.createElement('button');
    btn.className = 'row ' + cls;
    btn.onclick = ()=> goDay(idx);
    btn.innerHTML = `
      <div class="row-left">
        <div class="row-icon">${icon}</div>
        <span>${dayName}</span>
      </div>
      <span class="chevron">&#8250;</span>
    `;
    container.appendChild(btn);
  });
}

function goHome(){
  showScreen('screen-home');
  renderHome();
}

function goDay(idx){
  currentDayIdx = idx;
  const weekDates = getWeekDates();
  currentDate = weekDates[idx];
  showScreen('screen-day');
  renderDay();
}

function renderDay(){
  const dayName = DAYS[currentDayIdx];
  document.getElementById('day-title').textContent = dayName;

  const plan = getPlan();
  const key = dateKey(currentDate);
  let log = getLog(key);
  const templateExercises = plan[dayName] || [];

  if(!log){
    log = {
      day: dayName,
      isRest: false,
      exercises: templateExercises.map(ex=>({
        id: ex.id, name: ex.name, sets: ex.sets, reps: ex.reps, time: ex.time,
        completed: new Array(ex.sets).fill(false)
      }))
    };
  } else {
    if(typeof log.isRest === 'undefined') log.isRest = false;
    const logIds = log.exercises.map(e=>e.id);
    templateExercises.forEach(ex=>{
      if(!logIds.includes(ex.id)){
        log.exercises.push({id:ex.id, name:ex.name, sets:ex.sets, reps:ex.reps, time:ex.time, completed:new Array(ex.sets).fill(false)});
      }
    });
    log.exercises = log.exercises.filter(e=> templateExercises.some(t=>t.id===e.id));
    log.exercises.forEach(e=>{
      const t = templateExercises.find(x=>x.id===e.id);
      if(t){
        e.name=t.name; e.reps=t.reps; e.time=t.time;
        if(e.sets !== t.sets){
          const old = e.completed;
          e.completed = new Array(t.sets).fill(false).map((_,i)=> old[i] || false);
          e.sets = t.sets;
        }
      }
    });
  }

  window._currentLog = log;
  document.getElementById('rest-toggle').checked = !!log.isRest;

  const list = document.getElementById('exercise-list');
  list.innerHTML = '';
  log.exercises.forEach(ex=>{
    const metaLabel = ex.time && ex.time>0 ? `${ex.time}s x ${ex.sets} sets` : `${ex.reps||0} reps x ${ex.sets} sets`;
    const card = document.createElement('div');
    card.className = 'exercise-card';
    let boxes = '';
    for(let i=0;i<ex.sets;i++){
      const checked = ex.completed[i];
      boxes += `<div class="set-box ${checked?'checked':''}" onclick="toggleSet('${ex.id}',${i})">
        ${checked ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="4,13 9,18 20,6"/></svg>' : ''}
      </div>`;
    }
    card.innerHTML = `
      <div class="exercise-top">
        <div class="exercise-name" onclick="editExercise('${ex.id}')">${escapeHtml(ex.name)}</div>
        <div class="exercise-meta">${metaLabel}<br><button class="del-x" onclick="event.stopPropagation(); editExercise('${ex.id}')">edit / remove</button></div>
      </div>
      <div class="sets-row">${boxes}</div>
    `;
    list.appendChild(card);
  });
}

function toggleSet(exId, i){
  const log = window._currentLog;
  const ex = log.exercises.find(e=>e.id===exId);
  ex.completed[i] = !ex.completed[i];
  renderDaySoft();
}
function renderDaySoft(){
  const list = document.getElementById('exercise-list');
  const log = window._currentLog;
  list.innerHTML = '';
  log.exercises.forEach(ex=>{
    const metaLabel = ex.time && ex.time>0 ? `${ex.time}s x ${ex.sets} sets` : `${ex.reps||0} reps x ${ex.sets} sets`;
    const card = document.createElement('div');
    card.className = 'exercise-card';
    let boxes = '';
    for(let i=0;i<ex.sets;i++){
      const checked = ex.completed[i];
      boxes += `<div class="set-box ${checked?'checked':''}" onclick="toggleSet('${ex.id}',${i})">
        ${checked ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="4,13 9,18 20,6"/></svg>' : ''}
      </div>`;
    }
    card.innerHTML = `
      <div class="exercise-top">
        <div class="exercise-name" onclick="editExercise('${ex.id}')">${escapeHtml(ex.name)}</div>
        <div class="exercise-meta">${metaLabel}<br><button class="del-x" onclick="event.stopPropagation(); editExercise('${ex.id}')">edit / remove</button></div>
      </div>
      <div class="sets-row">${boxes}</div>
    `;
    list.appendChild(card);
  });
}

function saveProgress(){
  const key = dateKey(currentDate);
  saveLog(key, window._currentLog);
  goHome();
}

function toggleRest(){
  const checked = document.getElementById('rest-toggle').checked;
  window._currentLog.isRest = checked;

  const dayName = DAYS[currentDayIdx];
  const rest = getRest();
  rest[dayName] = checked;
  saveRest(rest);

  const key = dateKey(currentDate);
  saveLog(key, window._currentLog);
}

function goAdd(){
  editingExerciseId = null;
  document.getElementById('add-title').textContent = 'Add New Exercise';
  document.getElementById('add-name').value = '';
  document.getElementById('add-sets').value = 3;
  document.getElementById('add-reps').value = 10;
  document.getElementById('add-time').value = 0;
  document.getElementById('add-delete-btn').style.display = 'none';
  showScreen('screen-add');
}

function editExercise(exId){
  const plan = getPlan();
  const dayName = DAYS[currentDayIdx];
  const ex = (plan[dayName]||[]).find(e=>e.id===exId);
  if(!ex) return;
  editingExerciseId = exId;
  document.getElementById('add-title').textContent = 'Edit Exercise';
  document.getElementById('add-name').value = ex.name;
  document.getElementById('add-sets').value = ex.sets;
  document.getElementById('add-reps').value = ex.reps || 0;
  document.getElementById('add-time').value = ex.time || 0;
  document.getElementById('add-delete-btn').style.display = 'block';
  showScreen('screen-add');
}

function deleteExercise(){
  if(!editingExerciseId) return;
  const plan = getPlan();
  const dayName = DAYS[currentDayIdx];
  plan[dayName] = (plan[dayName]||[]).filter(e=>e.id!==editingExerciseId);
  savePlan(plan);
  showScreen('screen-day');
  renderDay();
}

function step(id, amt, min){
  const el = document.getElementById(id);
  let v = parseInt(el.value||'0',10) + amt;
  if(v<min) v=min;
  el.value = v;
}

function submitExercise(){
  const name = document.getElementById('add-name').value.trim();
  if(!name){ alert('Enter a workout name'); return; }
  const sets = Math.max(1, parseInt(document.getElementById('add-sets').value||'1',10));
  const reps = Math.max(0, parseInt(document.getElementById('add-reps').value||'0',10));
  const time = Math.max(0, parseInt(document.getElementById('add-time').value||'0',10));

  const plan = getPlan();
  const dayName = DAYS[currentDayIdx];
  if(!plan[dayName]) plan[dayName] = [];

  if(editingExerciseId){
    const ex = plan[dayName].find(e=>e.id===editingExerciseId);
    if(ex){ ex.name=name; ex.sets=sets; ex.reps=reps; ex.time=time; }
  } else {
    plan[dayName].push({id:newId(), name, sets, reps, time});
  }
  savePlan(plan);
  showScreen('screen-day');
  renderDay();
}

function cancelAdd(){
  showScreen('screen-day');
  renderDay();
}

function goHistory(){
  showScreen('screen-history');
  renderHistory();
}

function renderHistory(){
  pruneOldLogs();
  const rest = getRest();
  const entries = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('wt_log_')===0){
      const ds = k.replace('wt_log_','');
      const log = getLog(ds);
      if(log) entries.push({date: ds, log});
    }
  }
  entries.sort((a,b)=> a.date < b.date ? 1 : -1);

  const container = document.getElementById('history-rows');
  const empty = document.getElementById('history-empty');
  container.innerHTML = '';
  if(entries.length===0){ empty.style.display='block'; return; }
  empty.style.display='none';

  entries.forEach((entry, idx)=>{
    const d = new Date(entry.date+'T00:00:00');
    const dayName = DAYS[(d.getDay()+6)%7];
    const isRest = !!entry.log.isRest;
    const st = isRest ? 'blue' : computeStatus(entry.log.exercises);
    const cls = st==='green'?'green':st==='yellow'?'yellow':st==='blue'?'blue':'red';

    const row = document.createElement('div');
    row.className = 'hist-row ' + cls;
    const bodyId = 'hist-body-'+idx;
    let exLines = '';
    entry.log.exercises.forEach(ex=>{
      const done = ex.completed.filter(Boolean).length;
      const label = ex.time && ex.time>0 ? `${ex.time}s` : `${ex.reps||0} reps`;
      exLines += `<div class="hist-ex-line"><span>${escapeHtml(ex.name)}:</span><span>${label} x ${done}/${ex.sets} sets</span></div>`;
    });
    if(isRest){
      exLines = `<div class="hist-ex-line"><span>Rest day</span></div>`;
    } else if(entry.log.exercises.length===0){
      exLines = `<div class="hist-ex-line"><span>No exercises logged</span></div>`;
    }
    row.innerHTML = `
      <div class="hist-head" onclick="toggleHist('${bodyId}')">
        <span>${dayName}</span>
        <span>${displayDate(d)}</span>
      </div>
      <div class="hist-body" id="${bodyId}">${exLines}</div>
    `;
    container.appendChild(row);
  });
}

function toggleHist(id){
  document.getElementById(id).classList.toggle('open');
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

goHome();
</script>
</body>
</html>
